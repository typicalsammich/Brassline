<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brassline · Your calling workspace</title><link rel="icon" type="image/svg+xml" href="/static/logo.svg?v=handset-final"><link rel="stylesheet" href="/static/style.css"></head>
<body><div id="auth" class="auth" hidden><div class="card"><div class="brand"><img class="brand-lockup" src="/static/wordmark.svg?v=handset-final" alt="Brassline — Make the connection" width="214" height="78"></div><h1 id="authTitle">Sign in</h1><p id="authHint"></p><form id="authForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" minlength="12" autocomplete="current-password" required></label><label id="tokenLabel" hidden>Setup token<input id="setupToken" type="password" autocomplete="off"></label><label id="invitationLabel" hidden>Invitation link or code<input id="invitation" type="text" autocomplete="off"></label><button id="authButton">Sign in</button></form><button id="authSwitch" class="secondary" type="button">Create account</button><button id="forgotPassword" class="secondary" type="button">Forgot password?</button><p id="authError" role="alert"></p></div></div>
<div id="shell" hidden><aside><div class="brand"><img class="brand-lockup" src="/static/wordmark.svg?v=handset-final" alt="Brassline — Make the connection" width="214" height="78"></div><p class="muted">Your next conversation starts here.</p><nav id="nav"></nav><div class="account"><button id="account" class="account-profile secondary" type="button"></button><button class="secondary" id="logout">Sign out</button></div></aside><main><div class="top"><span>BRASSLINE / YOUR WORKSPACE</span><span id="mode"></span></div><header><div><p class="eyebrow">GOOD BUSINESS STARTS WITH A CONVERSATION</p><h1 id="title">Leads</h1><p id="subtitle"></p></div><button id="backup" class="secondary" hidden>Download backup</button></header><div id="content"></div><p id="notice" role="status"></p></main></div>
<aside id="scriptOverlay" hidden aria-label="Active call script"></aside><section id="callAssistant" hidden aria-label="Live transcript and call coaching"></section><div id="callPanel" hidden><div><span id="callMode" class="eyebrow">PRACTICE CALL · NO REAL PHONE CONNECTION</span><h2 id="callingName"></h2><span id="callState">Ringing…</span> <span id="timer">00:00</span><p id="callerLine" class="small-note"></p></div><div class="callActions"><button id="callHelper" class="secondary" hidden>Call helper</button><button id="simulateNoAnswer" class="secondary" hidden>Simulate no answer</button><button id="toggleScript" class="secondary" hidden>Show script</button><button id="mute" class="secondary">Mute</button><button id="pause" class="secondary">Pause after result</button><button id="hangup" class="secondary">Hang up</button><div id="results"></div></div></div><script src="/static/charts.js"></script><script src="/static/leads.js"></script><script src="/static/scraper.js"></script><script src="/static/dialer.js"></script><script src="/static/analytics.js"></script><script src="/static/account.js"></script><script src="/static/scripts.js"></script><script src="/static/crm.js"></script><script src="/static/call_assistant.js"></script><script src="/static/integrations.js"></script><script src="/static/shared_services.js"></script><script src="/static/research.js"></script><script src="/static/help.js"></script><script src="/static/app.js"></script></body></html>
