services:
  - type: web
    name: cold-calling-dashboard
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --ws-max-size 18000 --ws-max-queue 8
    envVars:
      - key: ONLINE
        value: "1"
      - key: DATABASE_PATH
        value: /var/data/dashboard.db
      - key: SETUP_TOKEN
        generateValue: true
    disk:
      name: dashboard-data
      mountPath: /var/data
      sizeGB: 1
